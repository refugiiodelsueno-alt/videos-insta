<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <!-- Sin corte: la hoja se va y por la ranura sale un billete. FALSO. La luz azul enseña el rastro. -->
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--fondo); }
        .bl-azul { position: absolute; inset: 0;
          -webkit-mask-image: linear-gradient(to right, #000 calc(var(--b) - 80px), transparent calc(var(--b) + 30px));
          mask-image: linear-gradient(to right, #000 calc(var(--b) - 80px), transparent calc(var(--b) + 30px)); }
        .bl-tinte { position: absolute; inset: 0; background: rgba(48, 96, 255, 0.6); mix-blend-mode: multiply; }
        .bl-borde { position: absolute; top: 0; bottom: 0; width: 200px; margin-left: -140px; mix-blend-mode: screen;
          background: linear-gradient(to right, rgba(90,140,255,0), rgba(130,175,255,0.6) 65%, rgba(90,140,255,0)); }
      </style>
      <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920" data-duration="__DURACION__">
        <div id="__ID__-esc" class="m-capa"></div>
      </div>
      <script type="module">
        import * as M from "./recursos/mundo.js";
        const C = __CUES__, D = __DURACION__;
        const t = (p, d) => (C[p] !== undefined ? C[p] : d);
        const tl = gsap.timeline({ paused: true });
        M.estilos();
        const esc = document.getElementById("__ID__-esc");
        M.fondo(esc);
        const polvo = M.polvo(esc, 13);
        const cam = K.crear(esc, `<div class="m-capa" style="transform-origin: 540px 1150px"></div>`);
        const imp = M.impresora(cam.appendChild(document.createElement("div")));
        const sal = M.salida(cam);
        const hoja = M.hoja(sal, { modo: "tenue" });
        hoja.style.transformOrigin = "0 0";
        const bil = M.billete(sal);
        bil.style.transformOrigin = "0 0";
        const sello = bil.querySelector(".sello");
        const azul = K.crear(bil, `<div class="bl-azul" data-layout-ignore><div class="bl-tinte"></div></div>`);
        M.puntos(azul, "oscuro", M.bits(M.HOY), 860, 420);
        const borde = K.crear(bil, `<div class="bl-borde"></div>`);
        const R = M.recuadros(bil, 860, 420);
        const svgR = R[0].el.ownerSVGElement;
        svgR.style.strokeWidth = "2";
        const capa = K.crear(esc, `<div class="m-capa"></div>`);
        const etq = M.etiqueta(capa, `el <b>rastro</b>`, 110, 630);
        M.techo(esc);

        const imp_ = t("imprimir", 2.08), bil_ = t("billetes", 2.48), fal = t("falsos", 2.88), ras = t("rastro", 3.84);
        imp.lcd.textContent = "Listo";
        const z0 = 1.06;
        K.reloj(tl, D, (s) => {
          polvo(s);
          const z = K.mez(z0, 1.12, K.suave(K.tramo(s, 0, fal))) + K.mez(0, 0.25, K.suave(K.tramo(s, fal + 0.3, ras + 0.3)));
          const oy = K.mez(0, 200, K.suave(K.tramo(s, fal + 0.3, ras + 0.3)));
          cam.style.transform = `translateY(${oy}px) scale(${z})`;
          // la hoja se va hacia arriba; el billete sale por la ranura
          const va = K.entra(K.tramo(s, imp_ - 0.3, bil_ + 0.1));
          hoja.style.transform = `translate(${140 + 30 * va}px, ${M.RANURA - 640 - 1300 * va}px) scale(0.8) rotate(${-4 * va}deg)`;
          const sale = K.sale(K.tramo(s, imp_, fal));
          bil.style.transform = `translate(110px, ${K.mez(M.RANURA + 10, M.RANURA - 440, sale)}px) scale(1)`;
          imp.lcd.textContent = s > imp_ && s < fal ? "Imprimiendo" : "Listo";
          imp.lcd.style.fontSize = s > imp_ && s < fal ? "30px" : "38px";
          // FALSO: el sello cae y el billete tiembla
          const st = K.tramo(s, fal - 0.05, fal + 0.12);
          sello.style.opacity = st > 0 ? 0.9 : 0;
          sello.style.transform = `rotate(-12deg) scale(${K.mez(2.2, 1, K.entra(st))})`;
          const tiem = Math.exp(-Math.pow((s - fal - 0.15) / 0.12, 2));
          sal.style.transform = `translate(${Math.sin(s * 90) * 7 * tiem}px, 0)`;
          // la luz azul lo barre de izquierda a derecha y aparece la cuadrícula
          const b = K.mez(-120, 1000, K.suave(K.tramo(s, ras - 0.35, ras + 0.45)));
          azul.style.setProperty("--b", b + "px");
          borde.style.left = b + "px";
          borde.style.opacity = K.tramo(s, ras - 0.35, ras - 0.2) * (1 - K.tramo(s, ras + 0.3, ras + 0.5));
          for (const r of R) {
            const a = ras - 0.25 + (r.x / 860) * 0.7;
            r.el.setAttribute("opacity", K.sale(K.tramo(s, a, a + 0.2)).toFixed(3));
          }
          const e = K.sale(K.tramo(s, ras + 0.1, ras + 0.4));
          etq.style.opacity = e;
          etq.style.transform = `translateY(${(1 - e) * 20}px)`;
        });
        window.__timelines["__ID__"] = tl;
      </script>
    </template>
  </body>
</html>
